apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments
  namespace: shop
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payments
  template:
    metadata:
      labels:
        app: payments
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: payments
      containers:
        - name: payments
          image: registry.example.com/shop/payments:3.2.0
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: GATEWAY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: payments-keys
                  key: api_key
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /ready
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
---
apiVersion: v1
kind: Service
metadata:
  name: payments
  namespace: shop
spec:
  selector:
    app: payments
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: payments
  namespace: shop
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: payments
---
# Placeholder values only. In a real cluster these come from an external secret store.
apiVersion: v1
kind: Secret
metadata:
  name: payments-keys
  namespace: shop
type: Opaque
data:
  api_key: cmVwbGFjZS1tZQ==
---
apiVersion: v1
kind: Secret
metadata:
  name: checkout-db
  namespace: shop
type: Opaque
data:
  password: cmVwbGFjZS1tZQ==
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: checkout-config
  namespace: shop
data:
  LOG_LEVEL: info
  SMTP_HOST: smtp.example.com
