apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments
  namespace: shop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payments
  template:
    metadata:
      labels:
        app: payments
    spec:
      containers:
        - name: payments
          image: registry.example.com/shop/payments
          ports:
            - containerPort: 8080
          env:
            - name: GATEWAY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: payments-keys
                  key: api_key
          securityContext:
            allowPrivilegeEscalation: true
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: payments
  namespace: shop
spec:
  selector:
    app: payments
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: payments
  namespace: shop
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: payment
---
apiVersion: v1
kind: Secret
metadata:
  name: payments-keys
  namespace: shop
type: Opaque
data:
  api_key: not-base64-at-all!
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: checkout-config
  namespace: shop
data:
  LOG_LEVEL: info
  SMTP_PASSWORD: mailpass123
