apiVersion: batch/v1
kind: CronJob
metadata:
  name: cart-cleanup
  namespace: shop
spec:
  schedule: "*/15 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: cleanup
              image: registry.example.com/shop/cart-cleanup:latest
              args: ["--older-than", "24h"]
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: log-agent
  namespace: shop
  annotations:
    kubeready.io/ignore: host-path
spec:
  selector:
    matchLabels:
      app: log-agent
  template:
    metadata:
      labels:
        app: log-agent
    spec:
      hostNetwork: true
      containers:
        - name: agent
          image: registry.example.com/infra/log-agent:2.3.1
          securityContext:
            privileged: true
          volumeMounts:
            - name: varlog
              mountPath: /var/log
      volumes:
        - name: varlog
          hostPath:
            path: /var/log
